name: Beta Web CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beta-web-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned DOM test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Targeted Web regression
        run: node --test
      - name: Beta build and scoped secret scan
        run: node scripts/verify-web.cjs
      - name: Whitespace check
        run: git diff --check
